name: Prepare release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.3.0a1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - run: uv sync --all-extras --group dev
      - run: uv run --no-sync pytest -q
      - run: uv build
      - run: uv run --no-sync twine check dist/*
      - run: uv run --no-sync python scripts/check_dist.py dist
      - name: Prepare draft only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: uv run --no-sync python scripts/prepare_release.py
