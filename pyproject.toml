[project]
name = "typact"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
aiohttp = [
    "aiohttp>=3.14.1",
]
httpx = [
    "httpx>=0.28.1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
