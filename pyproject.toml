[project]
name = "typact"
version = "0.2.2a2"
description = "Build production-ready Python API clients with FastAPI-style declarations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["http", "api-client", "async", "typing", "declarative", "fastapi", "pydantic", "sse", "retry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
aiohttp = [
    "aiohttp>=3.14.1",
]
httpx = [
    "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://typact.zzq.jl.cn"
Documentation = "https://typact.zzq.jl.cn/docs/getting-started/"
GitHub = "https://github.com/zzqjlcn/typact"
AtomGit = "https://atomgit.com/zhangzhanqi/typact"
Issues = "https://github.com/zzqjlcn/typact/issues"
Changelog = "https://github.com/zzqjlcn/typact/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-timeout>=2.3,<3", "build>=1.2,<2", "packaging>=24,<27", "twine>=6,<7"]

[tool.pytest.ini_options]
timeout = 60

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
typact = ["py.typed"]
